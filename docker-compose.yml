# Local: chạy api + web bằng một lệnh.  `make up`  (hoặc `docker compose up --build`)
# Web: http://localhost:3000   API: http://localhost:8000/docs
# Production KHÔNG dùng file này: web → Vercel, api → Railway (docs/ARCHITECTURE.md §6).
# Chưa có DB: API lưu trong RAM, restart là mất (db/migrations để dành cho PostgresRepository).

services:
  api:
    build: ./apps/api
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
